# Добавить в ~/.codex/config.toml (или в .codex/config.toml проекта).
# Пути config_file — относительно файла конфига; файлы ролей положить в agents/ рядом.

[agents]
max_threads = 4   # не больше 4 параллельных субагентов: дальше упираетесь в свою приёмку, а не в генерацию

[agents.explorer]
description = "Быстрая read-only разведка по кодовой базе: где что лежит, кто что вызывает. Возвращает вывод и ссылки на строки, а не содержимое файлов."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Ревью diff в чистом контексте против критерия приёмки: блокеры с файлом и строкой, что не проверено. Только чтение."
config_file = "agents/reviewer.toml"
